# CI/CD for the Credit Default Risk Space.
#
#   pull request  -> test
#   push to main  -> test -> deploy (huggingface/hub-sync) -> smoke test the live Space
#
# The deploy job needs a repository secret HF_TOKEN holding a Hugging Face token
# with write access, and the repository variable HF_SPACE_ID (owner/space-name).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once. A newer push waits for the one in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (parity on 5,993 test clients, inputs, config drift)
        run: python -m pytest -v

  deploy:
    name: Deploy to Hugging Face
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: huggingface-space
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          hf_version: "2.4.0"
          # The Space only needs the app, the model and its README.
          exclude: |
            tests/**
            scripts/**
            requirements-dev.txt
            pytest.ini
            model/parity_cases.csv

  smoke-test:
    name: Smoke test the live Space
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install client libraries
        run: pip install -r requirements-dev.txt
      - name: Call /score on the live Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/smoke_test.py "${{ vars.HF_SPACE_ID }}"
