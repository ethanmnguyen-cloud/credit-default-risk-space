# CI/CD for the Credit Default Risk Space (a free static Space).
#
#   pull request  -> test
#   push to main  -> test -> deploy (huggingface/hub-sync) -> smoke test the live Space
#
# The deploy job needs a repository secret HF_TOKEN holding a Hugging Face token
# with write access, and the repository variable HF_SPACE_ID (owner/space-name).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once. A newer push waits for the one in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Model tests (parity on 5,993 test clients, inputs, config drift)
        run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install the browser
        run: |
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Browser check of the page, served locally
        run: |
          python -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          python scripts/browser_check.py http://127.0.0.1:8000

  deploy:
    name: Deploy to Hugging Face
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: huggingface-space
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          hf_version: "2.4.0"
          # The Space only needs the page, the model and its README.
          exclude: |
            tests/**
            scripts/**
            package.json
            requirements-ci.txt
            model/parity_cases.csv

  smoke-test:
    name: Smoke test the live Space
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install the browser
        run: |
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Check the live page in a browser
        run: python scripts/smoke_test.py "${{ vars.HF_SPACE_ID }}"
      - name: Keep a screenshot of the live page
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-space-screenshot
          path: live_space.png
          if-no-files-found: ignore
